<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slalom project resources</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Slalom project resources</h1>
      <button id="add-project-btn" class="btn btn-primary">+ New project</button>
    </header>

    <main>
      <div id="projects-grid" class="projects-grid">
        <!-- Projects will be loaded here -->
      </div>
    </main>
  </div>

  <!-- Modal for adding/editing project -->
  <div id="project-modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2 id="modal-title">Add new project</h2>
      <form id="project-form">
        <div class="form-group">
          <label for="project-name">Project name</label>
          <input type="text" id="project-name" required>
        </div>
        <div class="form-group">
          <label for="project-description">Description</label>
          <textarea id="project-description" rows="3"></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal for adding/editing resource -->
  <div id="resource-modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2 id="resource-modal-title">Add resource</h2>
      <form id="resource-form">
        <div class="form-group">
          <label for="resource-type">Resource type</label>
          <select id="resource-type" required>
            <option value="link">Link (Miro, Figma, etc.)</option>
            <option value="local-file">Local File</option>
            <option value="shared-file">Shared Server File</option>
          </select>
        </div>
        <div class="form-group">
          <label for="resource-name">Resource name</label>
          <input type="text" id="resource-name" required>
        </div>
        <div class="form-group" id="url-group">
          <label for="resource-url">URL</label>
          <input type="url" id="resource-url">
        </div>
        <div class="form-group" id="path-group" style="display: none;">
          <label for="resource-path">File path</label>
          <input type="text" id="resource-path">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-secondary" id="cancel-resource-btn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
